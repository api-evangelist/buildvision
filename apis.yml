aid: buildvision
name: Buildvision
description: >-
  BuildVision is an AI bid-management and equipment-procurement platform for the
  construction industry. It monitors email inboxes and construction plan rooms for
  incoming bids, extracts equipment specifications from construction documents,
  matches them against a company's line card, and drafts quotes with automatic
  conflict detection and RFI generation. Products span bid triage automation, a
  "spec memory" of historical engineer data, equipment quoting, and channel
  intelligence for OEMs. BuildVision integrates with Microsoft Outlook and
  BuildingConnected and offers direct API / browser-agent integration to selection
  software by request, but publishes no public developer API, OpenAPI, or SDK.
  Surfaced as a portfolio company of Norwest Venture Partners and enriched by the
  API Evangelist pipeline from BuildVision's public surface.
